{% extends "base.html" %} {% block content %} {% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" class="card row">
  <label class="grow">Name <input name="name" required /></label>
  <label class="grow"
    >Muscle group <input name="muscle_group" required
  /></label>
  <button type="submit" class="primary">Add</button>
</form>
<ul class="list">
  {% for e in exercises %}
  <li>
    {{ e["exercise_name"]|title }}
    <span class="muted">{{ e["muscle_group"]|title }}</span>
  </li>
  {% endfor %}
</ul>
{% endblock %}
