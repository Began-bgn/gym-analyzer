{% extends "base.html" %} {% block content %} {% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" class="card row">
  <label class="grow"
    >Any date in the week <input type="date" name="week_start" required
  /></label>
  <button type="submit" class="primary">Generate review</button>
</form>
{% for r in reviews %}
<section class="card">
  <h2>Week of {{ r.weekly_start_date }}</h2>
  <p class="review">{{ r.review }}</p>
</section>
{% endfor %} {% endblock %}
