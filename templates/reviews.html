{% extends "base.html" %} {% block content %}
<h1>Weekly reviews</h1>
{% if error %}
<p><strong>{{ error }}</strong></p>
{% endif %}
<form method="post">
  <label
    >Any date in the week: <input type="date" name="week_start" required
  /></label>
  <button type="submit">Generate review</button>
</form>
{% for r in reviews %}
<h2>Week of {{ r.weekly_start_date }}</h2>
<p style="white-space: pre-wrap">{{ r.review }}</p>
{% endfor %} {% endblock %}
